<div id="optibox-hero">
  <!-- Section 1: ERP Source -->
  <div class="stage" id="stage-erp">
    <div class="label">ERP SYSTEM</div>
    <div class="erp-window">
      <div class="erp-header"></div>
      <div class="erp-row"><span></span></div>
      <div class="erp-row highlight"><span></span></div>
      <div class="erp-row"><span></span></div>
    </div>
  </div>

  <!-- Connection Line -->
  <svg class="connector-svg" viewBox="0 0 200 100">
    <path id="data-path" d="M0,50 Q100,50 200,50" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <circle id="data-packet" r="6" fill="#fbbf24" cx="0" cy="50" />
  </svg>

  <!-- Section 2: OptiBox UI -->
  <div class="stage" id="stage-optibox">
    <div class="label">OPTIBOX</div>
    <div class="app-mockup">
      <div class="app-sidebar">
        <div class="side-item"></div><div class="side-item active"></div><div class="side-item"></div>
      </div>
      <div class="app-content">
        <div class="cost-cards">
          <div class="card best">
            <div class="card-tag">BEST COST</div>
            <div class="price">€ 7.65</div>
          </div>
          <div class="card alt">
            <div class="price small">€ 10.60</div>
          </div>
        </div>
        <!-- 3D Packing View (Matches Screenshot) -->
        <div class="packing-view">
          <div class="wireframe-box">
            <div class="item blue"></div>
            <div class="item red"></div>
            <div class="item green"></div>
            <div class="item yellow"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
